name: build-debug
description: Build debug
runs:
  using: "composite"
  steps:
    # Set git to disable line endings conversion
    - name: Configure git
      shell: pwsh
      run: |
        & git config --global core.autocrlf false

    # Checkout latest commit for this repository to $GITHUB_WORKSPACE/TInvestor-source
    - name: Checkout TInvestor
      uses: actions/checkout@v6
      with:
        path: TInvestor-source

    # Calculate TInvestor hash on sources
    - name: Calculate TInvestor hash
      id: folders-hash
      uses: theowenyoung/folder-hash@v3
      with:
        path: |
          ./TInvestor-source/app
          ./TInvestor-source/libs
          ./TInvestor-source/tests
          ./TInvestor-source/tools

    # Download/upload cache
    - name: Caching
      id: cache-build
      uses: actions/cache@v5
      with:
        path: ./artifacts
        key: ${{ runner.os }}-build-debug-${{ steps.folders-hash.outputs.hash }}

    # Install required packages
    - name: System packages
      if: steps.cache-build.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        switch ("${{ runner.os }}")
        {
          "Windows" { choco install bzip2 }
          "Linux"   { sudo apt-get update; sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1 libxcb1 }
          "macOS"   { brew update }
        }

    # Download environment artifacts
    - name: Download environment artifacts (Qt/ZLib/Quazip)
      if: steps.cache-build.outputs.cache-hit != 'true'
      uses: thebrowsercompany/gha-download-tar-artifact@main
      with:
        name: env-qt-zlib-quazip-${{ matrix.config.name }}
        path: ./Qt

    # Download environment artifacts
    - name: Download environment artifacts (vcpkg)
      if: steps.cache-build.outputs.cache-hit != 'true'
      uses: thebrowsercompany/gha-download-tar-artifact@main
      with:
        name: env-vcpkg-${{ matrix.config.name }}
        path: ./Qt

    # Checkout googletest repository with specific version to $GITHUB_WORKSPACE/googletest-source
    - name: Checkout googletest
      if: steps.cache-build.outputs.cache-hit != 'true'
      uses: actions/checkout@v6
      with:
        repository: google/googletest
        path: Qt/googletest-source
        ref: ${{ env.GOOGLE_TEST_VERSION }}

    # Build TInvestor
    - name: Build TInvestor
      if: steps.cache-build.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        # Setup Developer PowerShell for Windows
        switch ("${{ runner.os }}")
        {
            "Windows" {
                Write-Output "Setup Developer PowerShell"
                # https://github.com/microsoft/terminal/issues/3821#issuecomment-651506501
                # The setup-msbuild action is not used since it does not set up the path to 'cl'
                # see: https://github.com/microsoft/setup-msbuild/issues/24
                ${VS_INST_PATH} = & "${Env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
                Write-Output "VS Installation Path: ${VS_INST_PATH}"
                Import-Module ${VS_INST_PATH}/Common7/Tools/Microsoft.VisualStudio.DevShell.dll
                Enter-VsDevShell -VsInstallPath ${VS_INST_PATH} -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -no_logo'
            }
        }

        ${Env:ZLIB_PATH} = "${Env:GITHUB_WORKSPACE}/Qt/zlib"
        ${Env:QUAZIP_PATH} = "${Env:GITHUB_WORKSPACE}/Qt/quazip"
        ${Env:VCPKG_PATH} = "${Env:GITHUB_WORKSPACE}/Qt/vcpkg"
        ${Env:GOOGLETEST_PATH} = "${Env:GITHUB_WORKSPACE}/Qt/googletest-source"

        # Create TInvestor-source/build/Desktop-Debug folder and enter into it
        New-Item -Path "TInvestor-source/build/Desktop-Debug" -ItemType "directory" -Force
        Set-Location -Path "TInvestor-source/build/Desktop-Debug"

        (Get-Content "${Env:GITHUB_WORKSPACE}/TInvestor-source/app/src/main.cpp") -replace 'DEV_BUILD', ${Env:GITHUB_SHA} | Set-Content "${Env:GITHUB_WORKSPACE}/TInvestor-source/app/src/main.cpp"

        switch ("${{ runner.os }}")
        {
            "Windows" {
                ${Env:QTDIR} = "${Env:GITHUB_WORKSPACE}/Qt/${Env:QT_VERSION}/msvc2022_64"
                & "${Env:QTDIR}/bin/qmake.exe" "${Env:GITHUB_WORKSPACE}/TInvestor-source/TInvestor.pro" -spec win32-msvc "CONFIG+=debug" "CONFIG+=qml_debug"
                & chcp 65001
                & "${Env:GITHUB_WORKSPACE}/Qt/jom/jom.exe" -f "${Env:GITHUB_WORKSPACE}/TInvestor-source/build/Desktop-Debug/Makefile" qmake_all
                & chcp 65001
                & "${Env:GITHUB_WORKSPACE}/Qt/jom/jom.exe"
            }
            "Linux" {
                ${Env:QTDIR} = "${Env:GITHUB_WORKSPACE}/Qt/${Env:QT_VERSION}/gcc_64"
                & "${Env:QTDIR}/bin/qmake" "${Env:GITHUB_WORKSPACE}/TInvestor-source/TInvestor.pro" -spec linux-g++ CONFIG+=debug CONFIG+=qml_debug
                & make -f "${Env:GITHUB_WORKSPACE}/TInvestor-source/build/Desktop-Debug/Makefile" qmake_all
                & make -j4
            }
        }

    # Prepare artifacts
    - name: Prepare artifacts
      if: steps.cache-build.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        Copy-Item "${Env:GITHUB_WORKSPACE}/TInvestor-source/build/Desktop-Debug" -Destination artifacts -Recurse

        switch ("${{ runner.os }}")
        {
            "Windows" {
                # Remove-Item "artifacts/app/build/gen" -Recurse -Force # Do not delete. Needed for clang-tidy
                Remove-Item "artifacts/app/debug" -Recurse -Force
                Remove-Item "artifacts/app/release" -Recurse -Force
                Remove-Item "artifacts/app/Makefile" -Force
                Remove-Item "artifacts/app/Makefile.Debug" -Force
                Remove-Item "artifacts/app/Makefile.Release" -Force
                Remove-Item "artifacts/libs" -Recurse -Force
                # Remove-Item "artifacts/tests/app_tests/build/gen" -Recurse -Force # Do not delete. Needed for clang-tidy
                Remove-Item "artifacts/tests/app_tests/debug" -Recurse -Force
                Remove-Item "artifacts/tests/app_tests/release" -Recurse -Force
                Remove-Item "artifacts/tests/app_tests/Makefile" -Force
                Remove-Item "artifacts/tests/app_tests/Makefile.Debug" -Force
                Remove-Item "artifacts/tests/app_tests/Makefile.Release" -Force
                # Remove-Item "artifacts/tests/notifier_tests/build/gen" -Recurse -Force # Do not delete. Needed for clang-tidy
                Remove-Item "artifacts/tests/notifier_tests/debug" -Recurse -Force
                Remove-Item "artifacts/tests/notifier_tests/release" -Recurse -Force
                Remove-Item "artifacts/tests/notifier_tests/Makefile" -Force
                Remove-Item "artifacts/tests/notifier_tests/Makefile.Debug" -Force
                Remove-Item "artifacts/tests/notifier_tests/Makefile.Release" -Force
                # Remove-Item "artifacts/tools/qt/notifier/build/gen" -Recurse -Force # Do not delete. Needed for clang-tidy
                Remove-Item "artifacts/tools/qt/notifier/debug" -Recurse -Force
                Remove-Item "artifacts/tools/qt/notifier/release" -Recurse -Force
                Remove-Item "artifacts/tools/qt/notifier/Makefile" -Force
                Remove-Item "artifacts/tools/qt/notifier/Makefile.Debug" -Force
                Remove-Item "artifacts/tools/qt/notifier/Makefile.Release" -Force
                Remove-Item "artifacts/tools/qt/Makefile" -Force
                Remove-Item "artifacts/tools/Makefile" -Force
                Remove-Item "artifacts/tests/Makefile" -Force
                Remove-Item "artifacts/.qmake.stash" -Force
                ReCopy-Item "artifacts/Makefile" -Force

                New-Item -Path "artifacts/libs" -ItemType "directory" -Force
                Copy-Item -Path artifacts/app/build/platforms -Destination artifacts/libs -Recurse -Force
                Copy-Item -Path artifacts/app/build/sqldrivers -Destination artifacts/libs -Recurse -Force
                Copy-Item -Path artifacts/app/build/tls -Destination artifacts/libs -Recurse -Force
                Copy-Item -Path artifacts/app/build/*.dll* -Destination artifacts/libs/ -Force
                Copy-Item -Path artifacts/tests/app_tests/build/platforms -Destination artifacts/libs -Recurse -Force
                Copy-Item -Path artifacts/tests/app_tests/build/sqldrivers -Destination artifacts/libs -Recurse -Force
                Copy-Item -Path artifacts/tests/app_tests/build/tls -Destination artifacts/libs -Recurse -Force
                Copy-Item -Path artifacts/tests/app_tests/build/*.dll* -Destination artifacts/libs/ -Force
                Copy-Item -Path artifacts/tests/notifier_tests/build/platforms -Destination artifacts/libs -Recurse -Force
                Copy-Item -Path artifacts/tests/notifier_tests/build/sqldrivers -Destination artifacts/libs -Recurse -Force
                Copy-Item -Path artifacts/tests/notifier_tests/build/tls -Destination artifacts/libs -Recurse -Force
                Copy-Item -Path artifacts/tests/notifier_tests/build/*.dll* -Destination artifacts/libs/ -Force
                Copy-Item -Path artifacts/tools/qt/notifier/build/platforms -Destination artifacts/libs -Recurse -Force
                Copy-Item -Path artifacts/tools/qt/notifier/build/sqldrivers -Destination artifacts/libs -Recurse -Force
                Copy-Item -Path artifacts/tools/qt/notifier/build/tls -Destination artifacts/libs -Recurse -Force
                Copy-Item -Path artifacts/tools/qt/notifier/build/*.dll* -Destination artifacts/libs/ -Force
                Remove-Item -Path artifacts/app/build/platforms -Recurse -Force
                Remove-Item -Path artifacts/app/build/sqldrivers -Recurse -Force
                Remove-Item -Path artifacts/app/build/tls -Recurse -Force
                Remove-Item -Path artifacts/app/build/*.dll* -Force
                Remove-Item -Path artifacts/tests/app_tests/build/platforms -Recurse -Force
                Remove-Item -Path artifacts/tests/app_tests/build/sqldrivers -Recurse -Force
                Remove-Item -Path artifacts/tests/app_tests/build/tls -Recurse -Force
                Remove-Item -Path artifacts/tests/app_tests/build/*.dll* -Force
                Remove-Item -Path artifacts/tests/notifier_tests/build/platforms -Recurse -Force
                Remove-Item -Path artifacts/tests/notifier_tests/build/sqldrivers -Recurse -Force
                Remove-Item -Path artifacts/tests/notifier_tests/build/tls -Recurse -Force
                Remove-Item -Path artifacts/tests/notifier_tests/build/*.dll* -Force
                Remove-Item -Path artifacts/tools/qt/notifier/build/platforms -Recurse -Force
                Remove-Item -Path artifacts/tools/qt/notifier/build/sqldrivers -Recurse -Force
                Remove-Item -Path artifacts/tools/qt/notifier/build/tls -Recurse -Force
                Remove-Item -Path artifacts/tools/qt/notifier/build/*.dll* -Force
            }
            "Linux" {
                # Remove-Item "artifacts/app/build/gen" -Recurse -Force # Do not delete. Needed for clang-tidy
                Remove-Item "artifacts/app/Makefile" -Force
                Remove-Item "artifacts/libs" -Recurse -Force
                # Remove-Item "artifacts/tests/app_tests/build/gen" -Recurse -Force # Do not delete. Needed for coverage and clang-tidy
                Remove-Item "artifacts/tests/app_tests/Makefile" -Force
                # Remove-Item "artifacts/tests/notifier_tests/build/gen" -Recurse -Force # Do not delete. Needed for coverage and clang-tidy
                Remove-Item "artifacts/tests/notifier_tests/Makefile" -Force
                Remove-Item "artifacts/tests/Makefile" -Force
                # Remove-Item "artifacts/tools/qt/notifier/build/gen" -Recurse -Force # Do not delete. Needed for clang-tidy
                Remove-Item "artifacts/tools/qt/notifier/Makefile" -Force
                Remove-Item "artifacts/tools/qt/Makefile" -Force
                Remove-Item "artifacts/tools/Makefile" -Force
                Remove-Item "artifacts/.qmake.stash" -Force
                Remove-Item "artifacts/Makefile" -Force

                New-Item -Path "artifacts/libs" -ItemType "directory" -Force
                Move-Item -Path artifacts/app/build/platforms -Destination artifacts/libs -Force
                Move-Item -Path artifacts/app/build/sqldrivers -Destination artifacts/libs -Force
                Move-Item -Path artifacts/app/build/tls -Destination artifacts/libs -Force
                Move-Item -Path artifacts/app/build/*.so* -Destination artifacts/libs/ -Force
                Move-Item -Path artifacts/tests/app_tests/build/platforms -Destination artifacts/libs -Force
                Move-Item -Path artifacts/tests/app_tests/build/sqldrivers -Destination artifacts/libs -Force
                Move-Item -Path artifacts/tests/app_tests/build/tls -Destination artifacts/libs -Force
                Move-Item -Path artifacts/tests/app_tests/build/*.so* -Destination artifacts/libs/ -Force
                Move-Item -Path artifacts/tests/notifier_tests/build/platforms -Destination artifacts/libs -Force
                Move-Item -Path artifacts/tests/notifier_tests/build/sqldrivers -Destination artifacts/libs -Force
                Move-Item -Path artifacts/tests/notifier_tests/build/tls -Destination artifacts/libs -Force
                Move-Item -Path artifacts/tests/notifier_tests/build/*.so* -Destination artifacts/libs/ -Force
                Move-Item -Path artifacts/tools/qt/notifier/build/platforms -Destination artifacts/libs -Force
                Move-Item -Path artifacts/tools/qt/notifier/build/sqldrivers -Destination artifacts/libs -Force
                Move-Item -Path artifacts/tools/qt/notifier/build/tls -Destination artifacts/libs -Force
                Move-Item -Path artifacts/tools/qt/notifier/build/*.so* -Destination artifacts/libs/ -Force
            }
        }

    # Prepare artifacts (tidy)
    - name: Prepare artifacts (tidy)
      shell: pwsh
      run: |
        Copy-Item artifacts -Destination artifacts-tidy -Recurse

        Move-Item -Path artifacts-tidy/tools/qt/notifier/build/Notifier* -Destination artifacts-tidy/app/build/ -Force
        Move-Item -Path artifacts-tidy/libs/* -Destination artifacts-tidy/app/build/ -Force

        Remove-Item "artifacts-tidy/app/build/gen" -Recurse -Force
        Remove-Item "artifacts-tidy/libs" -Recurse -Force
        Remove-Item "artifacts-tidy/tests" -Recurse -Force
        Remove-Item "artifacts-tidy/tools" -Recurse -Force

    # Upload artifacts
    - name: Upload artifacts
      uses: thebrowsercompany/gha-upload-tar-artifact@main
      with:
        name: build-debug-${{ matrix.config.name }}
        path: ./artifacts
        retention-days: 1

    # Upload artifacts (tidy)
    - name: Upload artifacts (tidy)
      uses: thebrowsercompany/gha-upload-tar-artifact@main
      with:
        name: build-debug-tidy-${{ matrix.config.name }}
        path: ./artifacts-tidy
        retention-days: 1
