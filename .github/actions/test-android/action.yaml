name: test-android
description: Test Android
inputs:
  gist-token:
    description: GitHub REST API access token.
    required: true
runs:
  using: "composite"
  steps:
    # Set git to disable line endings conversion
    - name: Configure git
      shell: pwsh
      run: |
        & git config --global core.autocrlf false

    # Checkout latest commit for this repository to $GITHUB_WORKSPACE/TInvestor-source
    - name: Checkout TInvestor
      uses: actions/checkout@v6
      with:
        path: TInvestor-source

    # Calculate TInvestor hash on sources
    - name: Calculate TInvestor hash
      id: folders-hash
      uses: theowenyoung/folder-hash@v3
      with:
        path: |
          ./TInvestor-source/app
          ./TInvestor-source/libs
          ./TInvestor-source/tests
          ./TInvestor-source/tools

    # Setup JDK 25
    - name: Setup JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        java-package: 'jdk'
        cache: 'gradle'

    # Test UT
    - name: Test UT
      shell: pwsh
      run: |
        Set-Location -Path "TInvestor-source/tools/android/notifier"
        & ./gradlew test
