name: test
description: Test
inputs:
  gist-token:
    description: GitHub REST API access token.
    required: true
runs:
  using: "composite"
  steps:
    # Set git to disable line endings conversion
    - name: Configure git
      shell: pwsh
      run: |
        & git config --global core.autocrlf false

    # Checkout latest commit for this repository to $GITHUB_WORKSPACE/TInvestor-source
    - name: Checkout TInvestor
      uses: actions/checkout@v6
      with:
        path: TInvestor-source

    # Calculate TInvestor hash on sources
    - name: Calculate TInvestor hash
      id: folders-hash
      uses: theowenyoung/folder-hash@v3
      with:
        path: |
          ./TInvestor-source/app
          ./TInvestor-source/libs
          ./TInvestor-source/tests
          ./TInvestor-source/tools

    # Download/upload cache
    - name: Caching
      id: cache-test
      uses: actions/cache@v5
      with:
        path: ./TInvestor-source/build/CoverageReport
        key: ${{ runner.os }}-test-${{ steps.folders-hash.outputs.hash }}

    # Install required packages
    - name: System packages
      if: steps.cache-test.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        switch ("${{ runner.os }}")
        {
            "Windows" { choco install opencppcoverage }
            "Linux"   { sudo apt-get update; sudo apt-get install -y lcov }
        }

    # Install Russian certificates
    - name: Install Russian certificates
      if: steps.cache-test.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        switch ("${{ runner.os }}")
        {
            "Windows" {
                Import-Certificate -FilePath ./TInvestor-source/app/dist/russian_trusted_root_ca_pem.crt -CertStoreLocation Cert:\LocalMachine\Root
                Import-Certificate -FilePath ./TInvestor-source/app/dist/russian_trusted_sub_ca_pem.crt -CertStoreLocation Cert:\LocalMachine\Root
            }
            "Linux" {
                sudo cp ./TInvestor-source/app/dist/russian_trusted_root_ca_pem.crt /usr/local/share/ca-certificates/
                sudo cp ./TInvestor-source/app/dist/russian_trusted_sub_ca_pem.crt /usr/local/share/ca-certificates/
                sudo update-ca-certificates
            }
        }

    # Download build artifacts (debug)
    - name: Download build artifacts (debug)
      if: steps.cache-test.outputs.cache-hit != 'true'
      uses: thebrowsercompany/gha-download-tar-artifact@main
      with:
        name: build-debug-${{ matrix.config.name }}
        path: ./TInvestor-source/build/Desktop-Debug

    # Download build artifacts (release)
    - name: Download build artifacts (release)
      if: steps.cache-test.outputs.cache-hit != 'true'
      uses: thebrowsercompany/gha-download-tar-artifact@main
      with:
        name: build-release-${{ matrix.config.name }}
        path: ./TInvestor-source/build/Desktop-Release

    # Prepare build artifacts (debug)
    - name: Prepare build artifacts (debug)
      if: steps.cache-test.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        Copy-Item -Path TInvestor-source/build/Desktop-Debug/libs/* -Destination TInvestor-source/build/Desktop-Debug/app/build/ -Recurse -Force
        Copy-Item -Path TInvestor-source/build/Desktop-Debug/libs/* -Destination TInvestor-source/build/Desktop-Debug/tests/app_tests/build/ -Recurse -Force
        Copy-Item -Path TInvestor-source/build/Desktop-Debug/libs/* -Destination TInvestor-source/build/Desktop-Debug/tests/notifier_tests/build/ -Recurse -Force
        Copy-Item -Path TInvestor-source/build/Desktop-Debug/libs/* -Destination TInvestor-source/build/Desktop-Debug/tools/qt/notifier/build/ -Recurse -Force

    # Prepare build artifacts (release)
    - name: Prepare build artifacts (release)
      if: steps.cache-test.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        Copy-Item -Path TInvestor-source/build/Desktop-Release/libs/* -Destination TInvestor-source/build/Desktop-Release/app/build/ -Recurse -Force
        Copy-Item -Path TInvestor-source/build/Desktop-Release/libs/* -Destination TInvestor-source/build/Desktop-Release/tests/app_tests/build/ -Recurse -Force
        Copy-Item -Path TInvestor-source/build/Desktop-Release/libs/* -Destination TInvestor-source/build/Desktop-Release/tests/notifier_tests/build/ -Recurse -Force
        Copy-Item -Path TInvestor-source/build/Desktop-Release/libs/* -Destination TInvestor-source/build/Desktop-Release/tools/qt/notifier/build/ -Recurse -Force

    # Test TInvestor
    - name: Test TInvestor
      if: steps.cache-test.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        # Enter to TInvestor-source/build/Desktop-Release/tests/app_tests/build folder
        Set-Location -Path "TInvestor-source/build/Desktop-Release/tests/app_tests/build"

        switch ("${{ runner.os }}")
        {
            "Windows" {
                & tzutil /s "Russian Standard Time"

                Start-Process -FilePath "app_tests.exe" -Wait

                # Enter to TInvestor-source/build/Desktop-Release/tests/notifier_tests/build folder
                Set-Location -Path "../../notifier_tests/build"

                Start-Process -FilePath "notifier_tests.exe" -Wait
            }
            "Linux" {
                & sudo timedatectl set-timezone Europe/Moscow

                ${Env:DISPLAY} = ":99"

                & sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
                Start-Sleep -Seconds 3

                ${Env:LD_LIBRARY_PATH} = "${Env:GITHUB_WORKSPACE}/TInvestor-source/build/Desktop-Release/tests/app_tests/build:${Env:LD_LIBRARY_PATH}"
                & ./app_tests

                # Enter to TInvestor-source/build/Desktop-Release/tests/notifier_tests/build folder
                Set-Location -Path "../../notifier_tests/build"

                ${Env:LD_LIBRARY_PATH} = "${Env:GITHUB_WORKSPACE}/TInvestor-source/build/Desktop-Release/tests/notifier_tests/build:${Env:LD_LIBRARY_PATH}"
                & ./notifier_tests
            }
        }

    # Collect coverage
    - name: Collect coverage
      if: steps.cache-test.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        # Enter to TInvestor-source folder
        Set-Location -Path "TInvestor-source"

        switch ("${{ runner.os }}")
        {
            "Windows" {
                & tzutil /s "Russian Standard Time"
                ${Env:PATH} = "C:\Program Files\OpenCppCoverage;${Env:PATH}"

                & ./make_coverage.bat --ci
            }
            "Linux" {
                & sudo timedatectl set-timezone Europe/Moscow

                ${Env:DISPLAY} = ":99"

                & sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
                Start-Sleep -Seconds 3

                & ./make_coverage.sh --ci
            }
        }

    # Upload coverage badge
    - name: Upload coverage badge
      if: steps.cache-test.outputs.cache-hit != 'true'
      uses: gaelgirodon/ci-badges-action@v1
      with:
        gist-id: ${{ env.GIST_ID }}
        token: ${{ inputs.gist-token }}
        prefix: TInvestor-${{ runner.os }}

    # Upload artifacts
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ matrix.config.name }}
        path: ./TInvestor-source/build/CoverageReport
        retention-days: 1
        compression-level: 9
